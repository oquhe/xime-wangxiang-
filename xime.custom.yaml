

keyboard:
  # ── 中文键盘 ──
  qwerty:
    layout:
      rows:
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [shift, z, x, c, v, b, n, m, delete]
        - [mode_change, comma, space, period, earth, enter]
    keys:
      # ── 第一行 ──
      # long_press 顺序：小写 → 大写 → 带变音符号的相似字母
      # display: bubble → 气泡显示；key → 显示在按键上（最多显示 2 个字）
      q: { tap: "q", swipe_up: "1", swipe_down: { label: "反查`", action: send_rime, value: '`' }, long_press: { display: "bubble", values: ["q", "Q"] } }
      w: { tap: "w", swipe_up: "2", swipe_down: { label: "引导/", action: send_rime, value: '/' }, long_press: { display: "bubble", values: ["w", "W"] } }
      e: { tap: "e", swipe_up: "3", long_press: { display: "bubble", values: ["e", "E", "è", "é", "ê", "ë"] } }
      r: { tap: "r", swipe_up: "4", swipe_down: { label: "数字", action: send_rime, value: "$" }, long_press: { display: "bubble", values: ["r", "R"] } }
      t: { tap: "t", swipe_up: "5", swipe_down: { label: "Tab", action: tab }, long_press: { display: "bubble", values: ["t", "T"] } }
      y: { tap: "y", swipe_up: "6",  long_press: { display: "bubble", values: ["y", "Y", "ÿ"] } }
      u: { tap: "u", swipe_up: { label: "7 ˉ", value: 7 },  swipe_down: { label: "编码", action: send_rime, value: "\\" }, long_press: { display: "bubble", values: ["u", "U", "ù", "ú", "û", "ü"] } }
      i: { tap: "i", swipe_up: { label: "8 ˊ", value: 8 },  long_press: { display: "bubble", values: ["i", "I", "ì", "í", "î", "ï"] } }
      o: { tap: "o", swipe_up: { label: "9 ˇ", value: 9 },  long_press: { display: "bubble", values: ["o", "O", "ò", "ó", "ô", "õ", "ö", "ø"] } }
      p: { tap: "p", swipe_up: { label: "0 ˋ", value: 0 },  long_press: { display: "bubble", values: ["p", "P"] } }

      # ── 第二行 ──
      a: { tap: "a", swipe_up: '~', swipe_down: { label: "全选", action: "select_all", display: "key" }, long_press: { display: "bubble", values: ["a", "A", "à", "á", "â", "ã", "ä", "å", "æ"] } }
      s: { tap: "s", swipe_up: "！", swipe_down: { label: "分词'", action: send_rime, value: "'" }, long_press: { display: "bubble", values: ["s", "S", "ß"] } }
      d: { tap: "d", swipe_up: "@", long_press: { display: "bubble", values: ["d", "D"] } }
      f: { tap: "f", swipe_up: { label: '/', value: '|' }, long_press: { display: "bubble", values: ["f", "F"] } }
      g: { tap: "g", swipe_up: "%",  long_press: { display: "bubble", values: ["g", "G"] } }
      h: { tap: "h", swipe_up: "“", long_press: { display: "bubble", values: ["h", "H"] } }
      j: { tap: "j", swipe_up: "”",  long_press: { display: "bubble", values: ["j", "J"] } }
      k: { tap: "k", swipe_up: "*",  long_press: { display: "bubble", values: ["k", "K"] } }
      l: { tap: "l", swipe_up: { label: '？', value: '?' },  long_press: { display: "bubble", values: ["l", "L"] } }

      # ── 第三行 ──
      z: { tap: "z", swipe_up: "（", swipe_down: { label: "撤销", action: "undo", display: "key" }, long_press: { display: "bubble", values: ["z", "Z"] } }
      x: { tap: "x", swipe_up: "）", swipe_down: { label: "剪切", action: "cut", display: "key" }, long_press: { display: "bubble", values: ["x", "X"] } }
      c: { tap: "c", swipe_up: "-", swipe_down: { label: "复制", action: "copy", display: "key" }, long_press: { display: "bubble", values: ["c", "C", "ç"] } }
      v: { tap: "v", swipe_up: "_", swipe_down: { label: "粘贴", action: "paste", display: "key" }, long_press: { display: "bubble", values: ["v", "V"] } }
      b: { tap: "b", swipe_up: "：",  long_press: { display: "bubble", values: ["b", "B"] } }
      n: { tap: "n", swipe_up: "；",  long_press: { display: "bubble", values: ["n", "N", "ñ"] } }
      m: { tap: "m", swipe_up: "、",  long_press: { display: "bubble", values: ["m", "M"] } }

      mode_change: { tap: { label: "123", action: command, value: mode_change_number } }
      comma: { width: 0.8, tap: { label: "，", value: "," }, swipe_up: { label: "符号", action: command, value: symbol } }
      period: { width: 0.8, tap: { label: "。", value: "." }, swipe_up: { label: "表情", action: command, value: emoji } }
      enter: { width: 1.2, tap: { action: enter }, swipe_up: { label: 换行, action: newline } }
      
      
  # ── 英文键盘 ──
  qwerty_en:
    layout:
      rows:
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [shift, z, x, c, v, b, n, m, delete]
        - [mode_change, comma, space, period, earth, enter]
    keys:
      # ── 第二行 ──
      a: { tap: "a", swipe_up: "`", long_press: { display: "bubble", values: ["a", "A"] } }
      s: { tap: "s", swipe_up: "!", long_press: { display: "bubble", values: ["s", "S"] } }
      d: { tap: "d", swipe_up: "@", long_press: { display: "bubble", values: ["d", "D"] } }
      f: { tap: "f", swipe_up: "#", long_press: { display: "bubble", values: ["f", "F"] } }
      g: { tap: "g", swipe_up: "%", long_press: { display: "bubble", values: ["g", "G"] } }
      h: { tap: "h", swipe_up: "'", long_press: { display: "bubble", values: ["h", "H"] } }
      j: { tap: "j", swipe_up: "&", long_press: { display: "bubble", values: ["j", "J"] } }
      k: { tap: "k", swipe_up: "*", long_press: { display: "bubble", values: ["k", "K"] } }
      l: { tap: "l", swipe_up: "?", long_press: { display: "bubble", values: ["l", "L"] } }
      # ── 第三行 ──
      z: { tap: "z", swipe_up: "(", long_press: { display: "bubble", values: ["z", "Z"] } }
      x: { tap: "x", swipe_up: ")", long_press: { display: "bubble", values: ["x", "X"] } }
      c: { tap: "c", swipe_up: "-", long_press: { display: "bubble", values: ["c", "C"] } }
      v: { tap: "v", swipe_up: "_", long_press: { display: "bubble", values: ["v", "V"] } }
      b: { tap: "b", swipe_up: ":", long_press: { display: "bubble", values: ["b", "B"] } }
      n: { tap: "n", swipe_up: ";", long_press: { display: "bubble", values: ["n", "N"] } }
      m: { tap: "m", swipe_up: "/", long_press: { display: "bubble", values: ["m", "M"] } }
      
      mode_change: { tap: { label: "123", action: command, value: mode_change_number } }
      comma: { width: 0.8, tap: ",", swipe_up: { label: "symbol", display: bubble, action: command, value: symbol } }
      period: { width: 0.8, tap: ".", swipe_up: { label: "emoji", display: bubble, action: command, value: emoji } }
      